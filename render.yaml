services:
  - type: worker
    name: sg-review-bot
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run deploy
    startCommand: npm start
    autoDeployTrigger: commit
    disk:
      name: review-bot-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.17.0
      - key: TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
